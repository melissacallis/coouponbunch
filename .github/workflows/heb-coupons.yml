name: Update HEB Coupons

on:
  schedule:
    # Runs every Sunday at 8:00 AM UTC. Adjust the cron for your timezone
    # (Central Time is UTC-6/UTC-5, so 8:00 UTC ≈ 2-3 AM Central).
    - cron: "0 8 * * 0"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        id: scrape
        run: |
          if python scrape_heb_coupons.py; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if coupons.json changed
        run: |
          git config user.name "heb-coupon-bot"
          git config user.email "actions@github.com"
          git add coupons.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update HEB coupons ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Open an issue if the scrape failed
        if: steps.scrape.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `HEB coupon scrape failed (${today})`,
              body: [
                "This week's scheduled coupon scrape failed — see the ",
                `[workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
                "",
                "The site's last known-good `coupons.json` was left in place ",
                "(marked stale) so heb.html doesn't go blank, but it will not ",
                "reflect this week's coupons until the scraper is fixed.",
                "",
                "Likely cause: H-E-B changed their page markup and the CSS ",
                "selectors in `scrape_heb_coupons.py` need updating.",
              ].join("\n"),
              labels: ["bug", "scraper"],
            });